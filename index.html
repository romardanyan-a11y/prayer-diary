<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Дневник">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Молитвенный дневник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F2F8; --card:rgba(255,255,255,.8); --card2:rgba(20,22,44,.055); --stroke:rgba(20,22,44,.08);
  --glass:rgba(255,255,255,.74); --text:#11121A; --muted:rgba(38,40,60,.58); --faint:rgba(38,40,60,.32);
  --gold:#C27A06; --green:#17975C; --danger:#D93D52; --violet:#6B5CF0; --shade:rgba(20,22,44,.35);
  --aur:.34; --shadow:0 10px 30px -18px rgba(30,30,70,.35);
  --grad:linear-gradient(135deg,#FFD27A 0%,#FF9E4D 48%,#FF6A8A 100%);
  --on-grad:#23110A;
  --serif:"Cormorant Garamond", Georgia, serif;
  --sans:"Onest", -apple-system, "SF Pro Text", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#07080E; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.075); --stroke:rgba(255,255,255,.075);
  --glass:rgba(20,21,34,.62); --text:#F6F3EC; --muted:rgba(235,235,245,.56); --faint:rgba(235,235,245,.28);
  --gold:#FFC75A; --green:#5CD89B; --danger:#FF6B7A; --violet:#9486FF; --shade:rgba(0,0,0,.6);
  --aur:.6; --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#07080E; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.075); --stroke:rgba(255,255,255,.075);
  --glass:rgba(20,21,34,.62); --text:#F6F3EC; --muted:rgba(235,235,245,.56); --faint:rgba(235,235,245,.28);
  --gold:#FFC75A; --green:#5CD89B; --danger:#FF6B7A; --violet:#9486FF; --shade:rgba(0,0,0,.6);
  --aur:.6; --shadow:none; color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.97)}
input,textarea{font:inherit;color:var(--text)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:12px}

.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:var(--aur)}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px)}
.aurora i:nth-child(1){width:70vmax;height:70vmax;left:-30vmax;top:-38vmax;background:#6B5CF0;animation:drift1 26s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:55vmax;height:55vmax;right:-28vmax;top:-18vmax;background:#FF8A4C;opacity:.55;animation:drift2 32s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:60vmax;height:60vmax;left:-10vmax;bottom:-55vmax;background:#FF5C8A;opacity:.35;animation:drift1 38s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(8vmax,6vmax) scale(1.08)}}
@keyframes drift2{to{transform:translate(-6vmax,10vmax) scale(.92)}}

.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:12px 16px calc(124px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 2px 4px}
.date{color:var(--muted);font-size:14px;font-weight:600}
h1{font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:4px 2px 18px}
h2{font-size:20px;font-weight:700;margin:0;letter-spacing:-.02em}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--stroke);padding:7px 11px;border-radius:99px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.ok i{background:var(--green);box-shadow:0 0 8px var(--green)}.sync.syncing i{background:var(--gold)}.sync.err i{background:var(--danger)}

/* ===== starry hero ===== */
.sky{position:relative;height:360px;border-radius:34px;overflow:hidden;margin:4px 0 14px;color:#FFF7EA;isolation:isolate;box-shadow:0 30px 60px -34px rgba(60,50,160,.7)}
.sky canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.sky::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,0) 45%);pointer-events:none}
.sky::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(255,255,255,.12);pointer-events:none;z-index:3}
.sky-top{position:absolute;z-index:2;left:20px;right:14px;top:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sky-date{font-size:14px;font-weight:600;opacity:.78}
.sky-greet{font-size:36px;font-weight:800;letter-spacing:-.04em;line-height:1.02;margin-top:4px;text-shadow:0 2px 20px rgba(0,0,0,.25)}
.sky-cap{font-size:13px;font-weight:500;opacity:.85;text-shadow:0 1px 8px rgba(0,0,0,.4);margin-top:8px;max-width:240px;line-height:1.35}
.sky-cap b{color:#FFD58A;font-weight:700}
.gl{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#FFF7EA;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12)}
.gl svg.i{width:20px;height:20px}
.sky-week{position:absolute;z-index:2;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wk{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 9px;border-radius:17px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.wk span{font-size:11px;font-weight:600;opacity:.65}
.wk b{font-size:15px;font-weight:700}
.wk em{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.18)}
.wk.on em{background:#FFD58A;box-shadow:0 0 10px #FFB65C}
.wk.today{background:#FFF7EA;color:#1A1330;border-color:transparent}
.wk.today em{background:rgba(26,19,48,.2)}.wk.today.on em{background:#FF9E4D;box-shadow:none}
.wk.future{opacity:.45}

/* CTA */
.cta{position:relative;width:100%;display:flex;align-items:center;gap:15px;margin:0 0 12px;padding:14px 16px 14px 14px;border-radius:28px;background:var(--grad);color:var(--on-grad);text-align:left;box-shadow:0 18px 40px -16px rgba(255,120,80,.6);overflow:hidden}
.cta::before{content:"";position:absolute;top:0;bottom:0;width:40%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 5s ease-in-out infinite}
@keyframes shine{0%,60%{left:-50%}100%{left:130%}}
.cta .orb{flex:none;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff 0 12%,rgba(255,255,255,.55) 32%,rgba(255,255,255,.12) 62%,transparent 70%);display:grid;place-items:center;position:relative}
.cta .orb::before{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(35,17,10,.18);animation:pulse 2.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.35);opacity:0}}
.cta b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}
.cta small{display:block;font-size:13.5px;font-weight:600;opacity:.72;margin-top:1px}
.cta .go{margin-left:auto;width:40px;height:40px;border-radius:50%;background:rgba(35,17,10,.12);display:grid;place-items:center}

/* bento */
.bento{display:grid;grid-template-columns:1fr 1.15fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--stroke);border-radius:24px;padding:15px 16px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);text-align:left;width:100%}
.tile .ti{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;margin-bottom:12px}
.tile .ti svg.i{width:19px;height:19px}
.tile b{display:block;font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1}
.tile span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:5px;line-height:1.25}
.tile.goal{grid-row:span 2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.tile.goal .ring{width:108px;height:108px}
.tile.goal .ring div b{font-size:32px;color:var(--text)}
.tile.goal .ring div b small{display:block;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:0;margin-top:4px}
.tile.sm{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;padding:13px 14px}
.tile.sm .ti{grid-row:span 2;margin:0}
.tile.sm b{font-size:26px}
.tile.sm span{margin-top:2px}
.c-gold{background:color-mix(in srgb,#FFB547 20%,transparent);color:var(--gold)}
.c-rose{background:color-mix(in srgb,#FF6A8A 20%,transparent);color:#FF6A8A}
.c-green{background:color-mix(in srgb,#43C985 20%,transparent);color:var(--green)}
.c-violet{background:color-mix(in srgb,#8B7CFF 22%,transparent);color:var(--violet)}
.c-blue{background:color-mix(in srgb,#5AA9F0 22%,transparent);color:#4B9BE6}

/* verse card */
.verse{position:relative;overflow:hidden;border-radius:30px;padding:20px 20px 16px;margin-bottom:12px;background:var(--card);border:1px solid var(--stroke);box-shadow:var(--shadow)}
.verse::before{content:"“";position:absolute;right:14px;top:-26px;font-family:var(--serif);font-size:170px;line-height:1;color:var(--gold);opacity:.14;pointer-events:none}
.lab{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--muted)}
.lab svg.i{width:17px;height:17px;color:var(--gold)}
.vt{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(24px,6.6vw,30px);line-height:1.2;margin:12px 0 14px;text-wrap:pretty}
.v-foot{display:flex;align-items:center;gap:8px}
.v-ref{font-weight:700;font-size:14px;color:var(--gold);margin-right:auto}
.rb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card2);color:var(--text)}
.rb svg.i{width:19px;height:19px}
.rb.fav{color:#FF6A8A}.rb.fav svg.i{fill:#FF6A8A}

/* suggestion */
.suggest{display:flex;align-items:center;gap:13px;padding:14px;border-radius:26px;margin-bottom:24px;border:1px solid var(--stroke);
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,transparent),color-mix(in srgb,var(--c) 4%,transparent)),var(--card)}
.suggest .tx{flex:1;min-width:0}
.suggest small{display:block;font-size:12.5px;font-weight:700;color:var(--muted)}
.suggest b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.suggest .sb{font-size:13px;color:var(--muted)}

.sec-h{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 12px}
.textbtn{font-size:14.5px;font-weight:700;color:var(--gold);padding:6px 2px}

/* rows */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--stroke);border-radius:24px;padding:11px;width:100%;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.ic{flex:none;width:50px;height:50px;border-radius:17px;display:grid;place-items:center;font-size:23px;
  background:linear-gradient(145deg,color-mix(in srgb,var(--c) 42%,transparent),color-mix(in srgb,var(--c) 14%,transparent));box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.row .tx{flex:1;min-width:0}
.row .tt{font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sb{color:var(--muted);font-size:13px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:3px;margin-top:7px}
.dots i{width:14px;height:5px;border-radius:3px;background:var(--card2)}
.dots i.on{background:var(--c)}
.tap{flex:none;min-width:48px;height:48px;padding:0 12px;border-radius:16px;background:var(--card2);display:flex;align-items:center;justify-content:center;gap:5px;font-weight:800;font-size:15px}
.tap.done{background:var(--grad);color:var(--on-grad)}
.tap svg.i{width:20px;height:20px}

.empty{text-align:center;padding:34px 22px;border-radius:26px;background:var(--card);border:1px dashed var(--stroke);color:var(--muted);font-size:15px}
.empty .ei{width:56px;height:56px;border-radius:18px;margin:0 auto 14px;display:grid;place-items:center;background:var(--card2);color:var(--text)}
.empty b{display:block;color:var(--text);font-size:18px;font-weight:700;margin-bottom:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:54px;padding:0 22px;border-radius:18px;font-weight:700;font-size:16px;background:var(--grad);color:var(--on-grad)}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.green{background:linear-gradient(135deg,#7BE8B0,#2FBF7A);color:#062012}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--danger) 35%,transparent)}
.btn.sm{height:44px;padding:0 16px;font-size:15px;border-radius:15px}
.btn.wide{width:100%}
.btn svg.i{width:20px;height:20px}
.mt{margin-top:16px}

.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--stroke);border-radius:16px;padding:4px;margin-bottom:16px}
.seg button{position:relative;z-index:1;height:40px;border-radius:12px;font-weight:700;font-size:14.5px;color:var(--muted)}
.seg button.on{color:var(--text)}
.seg .knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:12px;background:var(--card2);transition:transform .25s cubic-bezier(.3,.8,.3,1)}
.seg.r .knob{transform:translateX(100%)}

/* testimonies */
.testi{position:relative;display:block;width:100%;text-align:left;border-radius:28px;padding:18px 18px 16px;margin-bottom:12px;overflow:hidden;border:1px solid color-mix(in srgb,var(--c) 30%,transparent);
  background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--c) 30%,transparent),transparent 60%),var(--card)}
.testi .hd{display:flex;align-items:center;gap:11px}
.testi .ic{width:42px;height:42px;border-radius:14px;font-size:20px}
.testi .hd b{display:block;font-size:16px;font-weight:700}
.testi .hd span{font-size:12.5px;color:var(--muted);font-weight:600}
.testi q{display:block;font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.25;margin:14px 0 12px}
.testi q::before,.testi q::after{content:""}
.testi .ft{display:flex;flex-wrap:wrap;gap:6px}
.pillinfo{font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:99px;background:var(--card2)}
.pillinfo.g{background:color-mix(in srgb,#43C985 18%,transparent);color:var(--green)}

/* journal */
.search{position:relative;margin-bottom:10px}
.search svg.i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);width:19px;height:19px}
.search .in{padding-left:44px;height:48px}
.filters{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 6px;padding:2px 16px 6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;height:36px;padding:0 14px;border-radius:99px;background:var(--card);border:1px solid var(--stroke);font-size:14px;font-weight:600}
.filters button.on{background:var(--text);color:var(--bg);border-color:transparent}
.memory{border-radius:26px;padding:16px 18px;margin:8px 0 6px;background:linear-gradient(135deg,color-mix(in srgb,#8B7CFF 22%,transparent),color-mix(in srgb,#FF6A8A 10%,transparent)),var(--card);border:1px solid var(--stroke);display:block;width:100%;text-align:left}
.memory p{margin:8px 0 0;font-family:var(--serif);font-style:italic;font-size:20px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.day-h{font-size:14px;font-weight:700;color:var(--muted);margin:22px 4px 10px}
.ent{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--stroke);border-radius:24px;padding:16px 17px;margin-bottom:10px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.ent::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0;background:var(--k,var(--violet))}
.ent.session{--k:#FF9E4D}.ent.thanks{--k:#FFC75A}.ent.answer{--k:#43C985}.ent.word{--k:#9486FF}.ent.note{--k:#5AA9F0}
.ent.answer{background:linear-gradient(135deg,color-mix(in srgb,#43C985 16%,transparent),transparent 70%),var(--card)}
.ent .k{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center}
.ent .k em{font-style:normal;color:var(--k)}
.ent .k span{color:var(--muted);font-weight:600}
.ent p{margin:7px 0 0;white-space:pre-wrap;font-size:15.5px;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:13px;font-weight:600;padding:6px 11px;border-radius:99px;background:var(--card2)}
.jbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.jbtn{display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:22px;background:var(--card);border:1px solid var(--stroke);font-weight:700;font-size:15px;text-align:left}
.jbtn .ti{width:36px;height:36px;border-radius:12px;display:grid;place-items:center}
.jbtn svg.i{width:19px;height:19px}

/* stats */
.card{background:var(--card);border:1px solid var(--stroke);border-radius:26px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card h2{font-size:17px;margin-bottom:4px}
.small{font-size:13.5px;color:var(--muted)}
.ringwrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring div small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0;margin-top:3px}
.legend div{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:600;margin:6px 0}
.legend i{width:10px;height:10px;border-radius:4px}
.chart{display:flex;align-items:flex-end;gap:5px;height:120px;margin-top:14px}
.chart .cb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .cb i{width:100%;border-radius:7px;background:var(--card2);min-height:6px}
.chart .cb.on i{background:var(--grad)}
.chart .cb span{font-size:10.5px;font-weight:600;color:var(--muted)}
.chart .cb.t span{color:var(--text);font-weight:800}
.bar{display:grid;grid-template-columns:112px 1fr 30px;align-items:center;gap:10px;font-size:14.5px;font-weight:600;margin:11px 0}
.bar .tr{height:10px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:99px;background:var(--grad)}
.bar .n{text-align:right;font-weight:800}
.heat{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin-top:14px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--card2)}
.heat-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:8px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.badge{aspect-ratio:1;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;background:var(--card2);gap:6px}
.badge .e{font-size:30px;line-height:1;filter:grayscale(1);opacity:.3}
.badge b{font-size:12px;font-weight:700;line-height:1.2;color:var(--muted)}
.badge small{font-size:10.5px;color:var(--faint);font-weight:600}
.badge.on{background:radial-gradient(circle at 50% 30%,color-mix(in srgb,#FFB65C 30%,transparent),color-mix(in srgb,#FF6A8A 8%,transparent));box-shadow:inset 0 0 0 1px color-mix(in srgb,#FFB65C 35%,transparent)}
.badge.on .e{filter:none;opacity:1;text-shadow:0 0 18px rgba(255,180,90,.6)}
.badge.on b{color:var(--text)}

/* calendar */
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-h b{font-size:16px;font-weight:700;text-transform:capitalize}
.nav{width:36px;height:36px;border-radius:50%;background:var(--card2);display:grid;place-items:center}
.nav svg.i{width:18px;height:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{font-size:11.5px;font-weight:600;color:var(--muted);text-align:center;padding-bottom:4px}
.cal .d{aspect-ratio:1;border-radius:12px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;line-height:1.05}
.cal .d small{font-size:10px;font-weight:800;opacity:.8}
.cal .d.x{background:transparent}
.cal .d.on{color:var(--on-grad);font-weight:800}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--text)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 14px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock-in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.tabs{flex:1;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:30px;background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);box-shadow:0 16px 40px -12px rgba(0,0,0,.45);pointer-events:auto}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:24px;font-size:10.5px;font-weight:700;color:var(--muted);transition:background .2s,color .2s}
.tabs button.on{background:var(--card2);color:var(--text)}
.tabs button.on svg.i{color:var(--gold)}
.fab{flex:none;width:62px;height:62px;border-radius:50%;background:var(--grad);color:var(--on-grad);display:grid;place-items:center;box-shadow:0 14px 32px -10px rgba(255,120,80,.7);pointer-events:auto}
.fab svg.i{width:26px;height:26px;stroke-width:2.4}

/* sheet */
.shade{position:fixed;inset:0;background:var(--shade);z-index:40;opacity:0;transition:opacity .25s}
.shade.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:93%;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:32px 32px 0 0;padding:10px 18px calc(26px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.9,.25,1);box-shadow:0 -20px 50px -20px rgba(0,0,0,.5)}
.sheet.show{transform:none}
.sheet-in{max-width:560px;margin:0 auto;position:relative}
.grab{width:38px;height:5px;border-radius:9px;background:var(--faint);margin:0 auto 14px}
.sh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}
.sh-top h2{font-size:17px;text-align:center;flex:1}
.pill{height:40px;padding:0 16px;border-radius:99px;background:var(--card2);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.pill.pri{background:var(--grad);color:var(--on-grad)}
.pill.icon{width:40px;padding:0;justify-content:center}
.pill svg.i{width:19px;height:19px}
.pill:disabled{opacity:.35}
.pill.on{background:var(--text);color:var(--bg)}
label.l{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin:18px 4px 8px}
.in{width:100%;background:var(--card);border:1px solid var(--stroke);border-radius:18px;padding:15px 16px;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
.in:focus{border-color:color-mix(in srgb,var(--gold) 60%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 14%,transparent)}
.in::placeholder{color:var(--faint)}
textarea.in{min-height:112px;resize:vertical;line-height:1.5}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{height:40px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--stroke);font-size:14.5px;font-weight:600}
.pick button.on{background:var(--text);color:var(--bg);border-color:transparent}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.icons button{aspect-ratio:1;border-radius:16px;background:var(--card);border:1px solid var(--stroke);font-size:24px}
.icons button.on{background:var(--card2);box-shadow:inset 0 0 0 2px var(--text)}
.colors{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}
.colors button{aspect-ratio:1;border-radius:50%;background:var(--c)}
.colors button.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
.hero{text-align:center;margin:0 0 18px}
.hero .ic{width:92px;height:92px;border-radius:30px;font-size:44px;margin:0 auto 14px;box-shadow:0 20px 50px -14px var(--c),inset 0 1px 0 rgba(255,255,255,.2)}
.hero h3{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.12}
.hero p{color:var(--muted);margin:6px 0 0;font-size:14.5px}
.answer-box{border-radius:22px;padding:16px 18px;margin:0 0 14px;background:linear-gradient(135deg,color-mix(in srgb,#43C985 20%,transparent),color-mix(in srgb,#43C985 6%,transparent));border:1px solid color-mix(in srgb,#43C985 25%,transparent)}
.answer-box.gold{background:linear-gradient(135deg,color-mix(in srgb,#FFC75A 20%,transparent),color-mix(in srgb,#FFC75A 5%,transparent));border-color:color-mix(in srgb,#FFC75A 25%,transparent)}
.answer-box .k{display:flex;align-items:center;gap:6px;color:var(--green);font-weight:700;font-size:13.5px}
.answer-box.gold .k{color:var(--gold)}
.answer-box .k svg.i{width:17px;height:17px}
.answer-box p{margin:7px 0 0;white-space:pre-wrap;font-size:16px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.trio .tile{padding:14px}
.trio .tile b{font-size:26px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{white-space:pre-wrap;margin:0 0 16px;padding:14px 16px;border-radius:20px;background:var(--card);border:1px solid var(--stroke);font-size:15.5px}
.full-text{white-space:pre-wrap;font-size:17px;line-height:1.6}
.mode{display:flex;gap:14px;align-items:center;padding:14px;border-radius:24px;background:var(--card);border:1px solid var(--stroke);text-align:left;width:100%;margin-bottom:10px}
.mode .mi{flex:none;width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:26px}
.mode b{display:block;font-size:17px;font-weight:700}
.mode span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.mode .go{margin-left:auto;color:var(--muted)}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:20px;background:var(--card);border:1px solid var(--stroke);margin-bottom:8px}
.set b{display:block;font-size:15.5px;font-weight:700}
.set span{display:block;font-size:13px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:36px;height:36px;border-radius:50%;background:var(--card2);display:grid;place-items:center}
.stepper button svg.i{width:18px;height:18px}
.stepper output{min-width:22px;text-align:center;font-weight:800;font-size:18px}
input[type=time].in{width:auto;padding:9px 12px;font-weight:700}
.vlist .vi{padding:16px 18px;border-radius:24px;background:var(--card);border:1px solid var(--stroke);margin-bottom:10px}
.vlist .vi p{font-family:var(--serif);font-style:italic;font-size:20px;line-height:1.3;margin:0 0 10px}
.story{display:block;width:100%;max-width:300px;margin:0 auto 14px;border-radius:22px;box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}

/* prayer mode */
.pm{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;display:none}
.pm.show{display:block}
.pm .aurora{position:fixed;opacity:calc(var(--aur) + .15)}
.pm-in{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 20px calc(64px + env(safe-area-inset-bottom,0px))}
.pm-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pm-top .grow{flex:1;display:flex;justify-content:center}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;background:var(--glass);border:1px solid var(--stroke);padding:9px 14px;border-radius:99px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.music{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:99px;background:var(--glass);border:1px solid var(--stroke);font-weight:700;font-size:14px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.music svg.i{width:18px;height:18px}
.music.on{background:var(--grad);color:var(--on-grad);border-color:transparent}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.eq i{width:3px;background:currentColor;border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:4px}50%{height:12px}}
.steps{display:flex;gap:6px;margin:18px 0 28px}
.steps i{flex:1;height:4px;border-radius:9px;background:var(--card2);position:relative;overflow:hidden}
.steps i.on::after{content:"";position:absolute;inset:0;background:var(--grad)}
.pm-step{font-size:14px;font-weight:700;color:var(--muted)}
.pm h2{font-size:46px;font-weight:800;letter-spacing:-.045em;line-height:1;margin:6px 0 18px}
.pm .pv{font-family:var(--serif);font-style:italic;font-size:25px;line-height:1.25;margin:0}
.pm .pv.lord{font-size:34px;font-style:normal;font-weight:600;line-height:1.15}
.pm .pvr{display:inline-block;align-self:flex-start;margin:10px 0 18px;font-weight:700;font-size:13.5px;padding:6px 11px;border-radius:99px;background:var(--card2)}
.pm .pr{font-size:16.5px;color:var(--muted);margin:0 0 20px}
.pg-in{animation:rise .45s both}
.sit-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sit{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:20px;text-align:left;min-height:96px;background:radial-gradient(120% 100% at 0% 0%,color-mix(in srgb,var(--c) 24%,transparent),transparent 70%),var(--card);border:1px solid var(--stroke);color:var(--text)}
.sit span{font-size:28px;line-height:1}
.sit b{font-size:15.5px;font-weight:750;line-height:1.2}
.pl-hero{text-align:center;margin:2px 0 14px}.pl-e{font-size:52px;line-height:1.1}
.pl-hero h3{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:8px 0 6px}.pl-hero p{margin:0 6px;color:var(--muted);font-size:15px;line-height:1.4}
.pl-ben{display:flex;flex-direction:column;gap:10px;margin:0 0 16px}.pl-ben>div{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--card)}
.pl-ben i{font-style:normal;font-size:22px;flex:none}.pl-ben b{display:block;font-size:15px}.pl-ben small{color:var(--muted);font-size:13px}
.pl-plans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.pl-plan{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:18px;background:var(--card);border:2px solid var(--stroke);text-align:left;color:var(--text)}
.pl-plan.on{border-color:#E9B44A;background:color-mix(in srgb,#E9B44A 12%,var(--card))}
.pl-plan b{font-size:14px;color:var(--muted)}.pl-plan strong{font-size:22px;font-weight:800}.pl-plan small{font-size:12.5px;color:var(--muted)}
.pl-plan em{position:absolute;top:-9px;right:10px;font-style:normal;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--grad);color:var(--on-grad)}
.pl-note{text-align:center;margin:8px 6px 10px}.pl-legal{text-align:center;margin:4px 6px 8px;color:var(--muted)}.pl-legal .textbtn{font-size:inherit;font-weight:600;padding:2px 0}.pl-don{display:block;margin:6px auto 0}
.pl-on{text-align:center;font-weight:700;padding:14px;border-radius:16px;background:var(--card);margin:0 0 8px}
.pl-don-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pl-don-g button{height:58px;border-radius:16px;background:var(--card);border:1px solid var(--stroke);font-size:19px;font-weight:800;color:var(--text)}
.bgo.lock{opacity:.72}
.lg-card{margin:0 0 12px;padding:16px;border-radius:22px;background:var(--card);border:1px solid var(--stroke)}
.lg-card b{display:block;font-size:16.5px;font-weight:800}
.lg-card span{display:block;font-size:14px;color:var(--muted);margin:4px 0 12px;line-height:1.35}
.lg-card .btn{height:46px}
.lg-steps p{margin:6px 4px}
.lg-num{font-size:64px;font-weight:800;letter-spacing:.04em;text-align:center;margin:6px 0 10px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lg-pick{display:flex;gap:10px;justify-content:center}
.lg-pick button{width:84px;height:72px;border-radius:20px;font-size:30px;font-weight:800;background:var(--card);border:1px solid var(--stroke);color:var(--text)}
.rem-offer{margin:4px 0 8px;padding:16px;border-radius:22px;background:var(--card);border:1px solid var(--stroke);text-align:left;animation:rise .5s .6s both}
.rem-offer b{display:block;font-size:16.5px;font-weight:800}
.rem-offer span{display:block;font-size:13.5px;color:var(--muted);margin:4px 0 12px;line-height:1.35}
.rem-offer .btn{height:46px}
.pg-ctx{font-size:14.5px;font-weight:600;color:var(--gold);margin:-4px 0 14px;line-height:1.35}
.pvrow{display:flex;align-items:center;gap:8px;margin:10px 0 16px}
.pm .pvrow .pvr{margin:0}
.pg-swap{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--card2);color:var(--muted);flex:none}
.pg-swap svg.i{width:15px;height:15px}
.pm .pr.pg-say{font-size:17.5px;color:var(--text);opacity:.88;line-height:1.45;margin:0 0 16px}
.pg-q{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:8px}
.pg-q li{position:relative;padding:11px 14px 11px 34px;border-radius:16px;background:var(--card);border:1px solid var(--stroke);font-size:15.5px;line-height:1.38}
.pg-q li::before{content:"";position:absolute;left:14px;top:18px;width:8px;height:8px;border-radius:50%;background:var(--grad)}
.pg-q li.new{animation:rise .7s both}
.pg-more{display:block;margin:0 0 14px;font-size:14px;font-weight:700;color:var(--muted);padding:6px 2px}
.pg-pray{margin:0 0 20px;border-radius:18px;background:var(--card2)}
.pg-pray summary{list-style:none;cursor:pointer;padding:12px 16px;font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.pg-pray summary::-webkit-details-marker{display:none}
.pg-pray summary::after{content:"▾";color:var(--muted)}
.pg-pray[open] summary::after{content:"▴"}
.pg-pray p{margin:0;padding:0 16px 14px;font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.38}
.pg-how{margin-top:14px;padding:14px 16px;border-radius:20px;background:var(--card2);text-align:left}
.pg-how small{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pg-how>p{margin:6px 0 10px;font-size:15.5px;line-height:1.4}
.pg-how .pg-pray{margin:0;background:var(--card)}
.pg-how .pg-wait{font-size:14px;color:var(--gold)}
.pg-flow{margin:0 0 12px}
.pg-done{margin:0 0 12px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--stroke);font-weight:700;text-align:center}
.pm-top .pill.icon{background:var(--glass);border:1px solid var(--stroke)}
.pm-top .vbtn.on{background:var(--grad);color:var(--on-grad);border-color:transparent}
@media (prefers-reduced-motion: reduce){.pg-in,.pg-q li.new{animation:none}}
.breath{width:210px;height:210px;margin:16px auto 34px;position:relative;display:grid;place-items:center}
.breath .core{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFF4D6,#FFB65C 45%,#FF6A8A 100%);box-shadow:0 0 80px rgba(255,150,90,.6);animation:breathe 10s ease-in-out infinite}
.breath .rg{position:absolute;inset:0;border-radius:50%;border:1px solid var(--stroke);animation:breatheR 10s ease-in-out infinite}
.breath .rg:nth-child(2){inset:22px;animation-delay:.2s}
.breath .lbl{position:absolute;bottom:-30px;font-size:14px;font-weight:600;color:var(--muted)}
.breath .lbl::before{content:"Вдох…";animation:lbl 10s steps(1) infinite}
@keyframes breathe{0%,100%{transform:scale(.72)}45%,55%{transform:scale(1.18)}}
@keyframes breatheR{0%,100%{transform:scale(.8);opacity:.3}50%{transform:scale(1.05);opacity:1}}
@keyframes lbl{0%{content:"Вдох…"}50%{content:"Выдох…"}}
.checks{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.check{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--stroke);border-radius:22px;padding:10px 14px 10px 10px;text-align:left;width:100%}
.check .ic{width:42px;height:42px;border-radius:14px;font-size:20px}
.check .tx{flex:1;min-width:0}
.check .tx b{display:block;font-size:15.5px;font-weight:700}
.check .tx span{font-size:13px;color:var(--muted)}
.check .bx{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;color:var(--on-grad)}
.check .bx svg.i{width:16px;height:16px;stroke-width:3;opacity:0}
.check.on{border-color:color-mix(in srgb,#FF9E4D 45%,transparent)}
.check.on .bx{background:var(--grad);border-color:transparent}
.check.on .bx svg.i{opacity:1}
.addline{display:flex;gap:8px}
.addline .in{padding:12px 15px}
.addline .btn{height:50px;padding:0 16px}
.pm-foot{margin-top:auto;padding-top:24px;display:flex;gap:10px}
.pm-foot .btn{flex:1;height:58px;font-size:17px}
.pm-foot .btn.ghost{flex:0 0 58px;padding:0;background:var(--glass);border:1px solid var(--stroke)}
.done-orb{width:120px;height:120px;border-radius:50%;margin:48px auto 22px;background:radial-gradient(circle at 40% 35%,#FFF4D6,#FFB65C 45%,#FF6A8A 100%);box-shadow:0 0 90px rgba(255,150,90,.55);display:grid;place-items:center;font-size:50px}
.done-stats{display:flex;justify-content:center;gap:10px;margin:0 0 26px}
.done-stats div{background:var(--card);border:1px solid var(--stroke);border-radius:18px;padding:10px 16px;text-align:center}
.done-stats b{display:block;font-size:22px;font-weight:800}
.done-stats span{font-size:12.5px;color:var(--muted);font-weight:600}

#burst{position:fixed;inset:0;z-index:90;pointer-events:none;width:100%;height:100%}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px) scale(.96);opacity:0;z-index:95;background:var(--text);color:var(--bg);font-weight:700;font-size:14.5px;padding:12px 18px;border-radius:18px;display:flex;gap:16px;align-items:center;transition:.25s;pointer-events:none;width:max-content;max-width:calc(100% - 36px);box-shadow:0 14px 34px -10px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.toast button{color:var(--gold);font-weight:800;filter:saturate(1.3) brightness(.85)}

.st-bars i b{display:block;height:100%;width:0;background:#fff}
.st-bars i.done b{width:100%}
.st-bars i.run b{animation:bar 6.5s linear forwards}
@keyframes bar{to{width:100%}}
.st-x{position:absolute;right:16px;top:calc(28px + env(safe-area-inset-top,0px));z-index:3;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;color:#fff}
.st-body{margin:auto 0;position:relative;z-index:1;animation:rise .6s both}
.st-k{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;opacity:.8;margin-bottom:14px}
.st-big{font-size:58px;line-height:1;font-weight:600}
.serif{font-family:var(--serif)}
.st-num{font-size:120px;font-weight:800;letter-spacing:-.06em;line-height:.95}
.st-sub{font-size:19px;font-weight:600;opacity:.9;margin-top:10px;max-width:320px}
.st-quote{font-style:italic;font-size:28px;line-height:1.25;margin-top:22px}
.st-quote.big{font-size:34px;margin-top:0}
.st-quote small{font-family:var(--sans);font-style:normal;font-size:15px;opacity:.8}
.st-dots{display:flex;gap:8px;margin-top:22px}
.st-dots i{width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-style:normal}
.st-dots i small{font-size:11px;font-weight:700;opacity:.8}
.st-dots i.on{background:#fff;color:#111}
.st-foot{margin-top:26px;font-size:15px;font-weight:600;opacity:.75}
.st-prev,.st-next{position:absolute;top:80px;bottom:0;z-index:2}
.st-prev{left:0;width:30%}.st-next{right:0;width:70%}
.st-prev:active,.st-next:active{transform:none}
.storyc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:26px;margin-bottom:12px;color:#fff;background:radial-gradient(100% 120% at 0% 0%,#8B7CFF,transparent 60%),radial-gradient(100% 120% at 100% 100%,#FF6A8A,transparent 60%),#1B1640}
.storyc b{display:block;font-size:18px;font-weight:800}.storyc small{display:block;font-size:13px;opacity:.8}.storyc>svg.i{margin-left:auto}
@media (prefers-reduced-motion: reduce){.enter>*,.rings-svg .arc,.rings-star,.st-body,#cfBurn.burning .cf-row{animation:none}.st-bars i.run b{animation:none;width:100%}}

/* bible */
.c-teal{background:color-mix(in srgb,#3CC8B4 22%,transparent);color:#2BB5A0}
.tile b small.of{font-size:18px;color:var(--muted);font-weight:700}
.bhero{position:relative;overflow:hidden;border-radius:32px;padding:20px 14px 12px;margin-bottom:12px;color:#F2FFF9;
  background:radial-gradient(110% 80% at 0% 0%,rgba(60,200,180,.55),transparent 60%),radial-gradient(90% 90% at 100% 100%,rgba(107,92,240,.5),transparent 60%),radial-gradient(60% 60% at 100% 0%,rgba(255,200,120,.3),transparent 60%),#0C1A2A;
  box-shadow:0 30px 60px -34px rgba(40,160,150,.7)}
.bhero::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(255,255,255,.12);pointer-events:none}
.bh-q{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.25;padding:0 6px;opacity:.95}
.bh-q span{display:block;font-family:var(--sans);font-style:normal;font-size:12.5px;font-weight:700;color:#9FF0DD;margin-top:6px}
.bh-mid{display:flex;align-items:center;gap:16px;margin:18px 6px 16px}
.bh-ring{position:relative;width:84px;height:84px;flex:none}
.bh-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.bh-ring svg circle:first-of-type{stroke:rgba(255,255,255,.14)}
.bh-ring div{position:absolute;inset:0;display:grid;place-items:center;font-size:28px}
.bh-ring div svg.i{width:34px;height:34px;transform:none;stroke-width:2.6;color:#7BE8C8}
.bh-mid small{display:block;font-size:13px;font-weight:600;opacity:.7}
.bh-mid b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:2px 0 3px}
.bh-mid span{display:block;font-size:13.5px;opacity:.75}
.bh-btns{display:flex;gap:8px;margin:0 2px 12px}
.bh-btns .btn{flex:1;height:50px;font-size:15px;background:linear-gradient(135deg,#9FF0DD,#3CC8B4);color:#04201B}
.bh-btns .btn.glass{flex:0 0 auto;background:rgba(255,255,255,.14);color:#F2FFF9;border:1px solid rgba(255,255,255,.14)}
.bweek{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.bweek .wk.on em{background:#7BE8C8;box-shadow:0 0 10px #3CC8B4}
.bweek .wk.today.on em{background:#2BB5A0}
.planc{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left}
.planc b{display:block;font-size:18px;font-weight:700;margin-top:6px}
.planc span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.shelf-h{font-size:12.5px;font-weight:700;color:var(--muted);margin:16px 2px 8px}
.shelf{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.bk{position:relative;height:40px;border-radius:11px;background:var(--card2);overflow:hidden;font-size:11px;font-weight:700;display:grid;place-items:center}
.bk i{position:absolute;left:0;right:0;bottom:0;height:var(--p);background:linear-gradient(0deg,#2FBF9A,#7BE8C8);opacity:.8}
.bk span{position:relative;z-index:1}
.bk.done{color:#04201B}
.books{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:4px}
.books button{height:40px;border-radius:12px;background:var(--card);border:1px solid var(--stroke);font-size:12.5px;font-weight:700}
.books button.done{box-shadow:inset 0 -3px 0 #2FBF9A}
.books button.on{background:var(--text);color:var(--bg);border-color:transparent}
.chs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.chs button{aspect-ratio:1;border-radius:11px;background:var(--card);border:1px solid var(--stroke);font-size:13.5px;font-weight:700}
.chs button.was{background:color-mix(in srgb,#2FBF9A 16%,transparent);border-color:color-mix(in srgb,#2FBF9A 30%,transparent)}
.chs button.on{background:linear-gradient(135deg,#9FF0DD,#3CC8B4);color:#04201B;border-color:transparent}
.ent.bible{--k:#2BB5A0}.ent.sermon{--k:#FF6A8A}.ent.fast{--k:#C9A27A}
.learn{font-family:var(--serif);font-style:italic;font-size:26px;line-height:1.5;padding:18px 18px;border-radius:24px;background:var(--card);border:1px solid var(--stroke)}
.mw.h{font:inherit;font-style:normal;font-family:var(--sans);font-size:17px;font-weight:700;min-width:30px;padding:2px 8px;border-radius:9px;background:var(--card2);border-bottom:2px solid var(--gold);color:var(--gold);vertical-align:2px}
.vi .tagl{font-size:12px;font-weight:700;color:var(--green);margin-right:auto}

function wrapText(ctx,text,maxW){const words=text.split(" "),lines=[];let cur="";words.forEach(w=>{const t=cur?cur+" "+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t});if(cur)lines.push(cur);return lines}

  const st=makeStars(160,[{id:"a1"},{id:"b2"},{id:"c3"}]).map(s=>Object.assign({},s,{y:s.y*.55}));
  paintSky(ctx,W,H,0,{stars:st,scale:2.6,hillY:.86,crossS:34});

  ctx.fillStyle="#FFF7EA";ctx.textAlign="center";

  const lh=size*1.22,blockH=lines.length*lh,y0=H*.44-blockH/2;
  ctx.shadowColor="rgba(0,0,0,.35)";ctx.shadowBlur=24;lines.forEach((l,i)=>ctx.fillText(l,W/2,y0+i*lh+size*.8));ctx.shadowBlur=0;
  ctx.font='700 40px "Onest", Arial, sans-serif';ctx.fillStyle="#FFD58A";ctx.fillText(v.r,W/2,y0+blockH+size*.8+30);
  ctx.font='600 30px "Onest", Arial, sans-serif';ctx.fillStyle="rgba(255,247,234,.6)";ctx.fillText("Молитвенный дневник",W/2,H-110);
  return cv;
}

function tod(){const h=new Date().getHours();return h<5?"n":h<12?"m":h<18?"d":"e"}
const tmOk=(v,t)=>!v.tm||v.tm===t||(v.tm==="e"&&t==="n");

  let ok=L.map((_,i)=>i).filter(i=>tmOk(L[i],t)&&i!==not);if(VOICE_ON&&S.meta.pmVoice&&isPlus()){const vo=ok.filter(i=>vName(key,i,"m"));if(vo.length)ok=vo}if(!ok.length)return not==null?-1:not;
  let seen={};try{seen=JSON.parse(localStorage.getItem("pj-lastg")||"{}")}catch(e){}const rec=Array.isArray(seen[key])?seen[key]:[];
  let pool=ok.filter(i=>!rec.includes(i));if(!pool.length)pool=ok;
  const tp=pool.filter(i=>L[i].tm),i=tp.length&&Math.random()<.4?tp[Math.floor(Math.random()*tp.length)]:pool[Math.floor(Math.random()*pool.length)];
  seen[key]=[i].concat(rec.filter(x=>x!==i)).slice(0,Math.max(1,Math.min(5,ok.length-2)));try{localStorage.setItem("pj-lastg",JSON.stringify(seen))}catch(e){}return i}
